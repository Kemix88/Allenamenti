<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050509" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Allenamento A/B</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="weekBadge">SETTIMANA A</div>
        <h1 id="pageTitle">Allenamento di oggi</h1>
      </div>
      <button id="installBtn" class="icon-btn hidden" aria-label="Installa app">＋</button>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav" aria-label="Navigazione">
      <button data-view="today" class="nav-btn active"><span>◉</span><small>Oggi</small></button>
      <button data-view="calendar" class="nav-btn"><span>▦</span><small>Calendario</small></button>
      <button data-view="program" class="nav-btn"><span>≡</span><small>Programma</small></button>
      <button data-view="history" class="nav-btn"><span>↺</span><small>Storico</small></button>
      <button data-view="progress" class="nav-btn"><span>⌁</span><small>Progressi</small></button>
      <button data-view="settings" class="nav-btn"><span>⚙</span><small>Impostazioni</small></button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modalRoot"></div>
  <div id="timerOverlay" class="timer-overlay hidden">
    <div class="timer-card">
      <div class="eyebrow">RECUPERO</div>
      <div id="timerText" class="timer-text">01:30</div>
      <div class="timer-actions">
        <button id="timerMinus" class="secondary">-15s</button>
        <button id="timerStop" class="danger">Stop</button>
        <button id="timerPlus" class="secondary">+15s</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
