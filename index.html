<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050509" />
  <meta name="color-scheme" content="dark" />
  <title>Allenamento A/B</title>
  <style>
:root{
  --bg:#050509; --panel:#0c0d16; --panel2:#111321; --text:#f7f8ff; --muted:#9297aa;
  --blue:#2f7cff; --violet:#8b5cf6; --line:#24283a; --green:#35d07f; --amber:#ffbf4b; --red:#ff5d73;
  --shadow:0 14px 40px rgba(0,0,0,.32); --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(139,92,246,.18),transparent 28%),radial-gradient(circle at 0 0,rgba(47,124,255,.16),transparent 26%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100%}
body{padding-bottom:90px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px 18px 12px;background:linear-gradient(180deg,rgba(5,5,9,.98),rgba(5,5,9,.82),transparent);backdrop-filter:blur(14px)}
.topbar h1{margin:2px 0 0;font-size:24px;letter-spacing:-.03em}.eyebrow{font-size:11px;letter-spacing:.16em;color:#9fbaff;font-weight:800}.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);width:42px;height:42px;border-radius:13px;font-size:22px}.hidden{display:none!important}
main{padding:10px 16px 18px;max-width:760px;margin:0 auto}.card{background:linear-gradient(180deg,rgba(17,19,33,.96),rgba(10,11,20,.96));border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.hero{padding:18px;background:linear-gradient(135deg,rgba(47,124,255,.18),rgba(139,92,246,.14) 60%,rgba(17,19,33,.95));border-color:#313858}.hero h2{margin:5px 0 8px;font-size:26px}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.space{justify-content:space-between}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#0a0c14;border:1px solid var(--line);border-radius:14px;padding:12px}.metric b{display:block;font-size:18px;margin-top:4px}.metric small{color:var(--muted)}
.primary,.secondary,.danger,.ghost{border-radius:13px;padding:12px 14px;font-weight:800;border:1px solid transparent;color:white}.primary{background:linear-gradient(135deg,var(--blue),var(--violet))}.secondary{background:#161a2a;border-color:#2a2f45}.danger{background:#37141c;border-color:#6b2633}.ghost{background:transparent;border-color:var(--line);color:#cbd2e7}.wide{width:100%}.small-btn{padding:7px 9px;border-radius:10px;font-size:12px}.status{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid var(--line);background:#111421}.status.done{color:#9ff1c1;border-color:#225a3c}.status.partial{color:#ffd37f;border-color:#624a18}.status.skipped{color:#ff9fad;border-color:#6a2731}.status.planned{color:#acc3ff;border-color:#2b447a}.status.rest{color:#acb0bf}
.exercise{border:1px solid var(--line);border-radius:16px;padding:13px;background:#0a0c14;margin-top:10px}.exercise h3{margin:0;font-size:16px}.exercise-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.tag{font-size:10px;padding:4px 7px;border-radius:999px;background:#171a2b;color:#b9c6ff;border:1px solid #2a3152;font-weight:700}.set-grid{display:grid;grid-template-columns:36px minmax(70px,1fr) minmax(62px,.9fr) minmax(58px,.8fr) minmax(58px,.8fr) 42px;gap:6px;align-items:center;margin-top:9px}.set-grid .head{font-size:10px;color:var(--muted);text-align:center}.set-grid input{width:100%;background:#0d101a;border:1px solid #2a2e41;color:white;border-radius:10px;padding:9px 7px;text-align:center}.set-grid .check{width:38px;height:38px;border-radius:10px;border:1px solid #30354b;background:#121625;color:#b9c5e7}.set-grid .check.on{background:linear-gradient(135deg,#1a9f5f,#35d07f);color:#00150a}.previous{font-size:12px;color:#aeb6ca;margin-top:8px}.suggestion{font-size:12px;color:#bca9ff;margin-top:4px}.note-input,textarea,input[type=text],input[type=number],input[type=date],select{width:100%;background:#0c0f19;color:white;border:1px solid #2a2e41;border-radius:12px;padding:11px}.note-input{margin-top:9px;min-height:68px;resize:vertical}label{font-size:12px;color:#b6bdd0;display:grid;gap:6px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(7,7,12,.96);backdrop-filter:blur(18px);border-top:1px solid #1d2131;display:grid;grid-template-columns:repeat(6,1fr);padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.nav-btn{border:0;background:transparent;color:#7f8498;display:grid;gap:2px;place-items:center;padding:5px 2px}.nav-btn span{font-size:19px}.nav-btn small{font-size:9px}.nav-btn.active{color:#aebfff}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar-weekdays div{text-align:center;font-size:10px;color:var(--muted);padding:5px}.day{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:#0c0f18;color:white;display:flex;flex-direction:column;justify-content:space-between;padding:7px;min-width:0}.day.dim{opacity:.33}.day.today{outline:2px solid #5b77ff}.day .n{font-weight:800}.dot{width:8px;height:8px;border-radius:99px;background:#566078}.dot.done{background:var(--green)}.dot.partial{background:var(--amber)}.dot.skipped{background:var(--red)}.dot.planned{background:#5d8cff}.dot.rest{background:#414556}.day .abbr{font-size:8px;color:#aeb6ca;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #202438}.list-item:last-child{border-bottom:0}.list-item h4{margin:0 0 4px}.list-item p{margin:0;color:var(--muted);font-size:12px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#0d1019;color:#abb0bf;border-radius:999px;padding:9px 12px}.tab.active{background:linear-gradient(135deg,rgba(47,124,255,.28),rgba(139,92,246,.25));color:white;border-color:#46598a}.chart{width:100%;height:230px;background:#090b12;border:1px solid var(--line);border-radius:14px}.chart text{fill:#8f97ab;font-size:10px}.chart .line{fill:none;stroke:#7f8cff;stroke-width:3}.chart .point{fill:#b49aff}.chart .grid{stroke:#24283a;stroke-width:1}
.modal-backdrop{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}.modal{width:min(760px,100%);max-height:88vh;overflow:auto;background:#0b0d16;border:1px solid #2a2f43;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -25px 60px rgba(0,0,0,.5)}.modal h2{margin:0 0 14px}.modal-actions{display:flex;gap:8px;margin-top:14px}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);z-index:100;background:#171a28;border:1px solid #30354b;color:white;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.timer-overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:20px}.timer-card{width:min(390px,100%);text-align:center;background:linear-gradient(180deg,#121526,#090b12);border:1px solid #333a5a;border-radius:26px;padding:26px;box-shadow:var(--shadow)}.timer-text{font-size:68px;font-weight:900;letter-spacing:-.06em;margin:16px 0}.timer-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.superset{border-left:3px solid #7358ea;padding-left:10px}.superset-label{font-size:11px;color:#b9a9ff;font-weight:800;margin-top:10px}.drag-actions{display:flex;gap:6px}.tiny{font-size:11px;color:var(--muted)}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.set-grid{grid-template-columns:30px minmax(55px,1fr) minmax(50px,.8fr) minmax(50px,.8fr) minmax(50px,.8fr) 38px}.set-grid input{padding:8px 4px}.topbar h1{font-size:22px}.bottom-nav small{font-size:8px}.timer-text{font-size:58px}}

  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="weekBadge">SETTIMANA A</div>
        <h1 id="pageTitle">Allenamento di oggi</h1>
      </div>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav" aria-label="Navigazione">
      <button data-view="today" class="nav-btn active"><span>◉</span><small>Oggi</small></button>
      <button data-view="calendar" class="nav-btn"><span>▦</span><small>Calendario</small></button>
      <button data-view="program" class="nav-btn"><span>≡</span><small>Programma</small></button>
      <button data-view="history" class="nav-btn"><span>↺</span><small>Storico</small></button>
      <button data-view="progress" class="nav-btn"><span>⌁</span><small>Progressi</small></button>
      <button data-view="settings" class="nav-btn"><span>⚙</span><small>Impostazioni</small></button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modalRoot"></div>
  <div id="timerOverlay" class="timer-overlay hidden">
    <div class="timer-card">
      <div class="eyebrow">RECUPERO</div>
      <div id="timerText" class="timer-text">01:30</div>
      <div class="timer-actions">
        <button id="timerMinus" class="secondary">-15s</button>
        <button id="timerStop" class="danger">Stop</button>
        <button id="timerPlus" class="secondary">+15s</button>
      </div>
    </div>
  </div>

  <script>
(() => {
  'use strict';
  const STORAGE_KEY = 'allenamentoAB_v1';
  const START_DATE = '2026-09-14';
  const DAY_NAMES = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
  const MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

  const ex = (name, sets, reps, rest, opts={}) => ({
    id: cryptoId(), name, sets, reps, rest, group: opts.group || '', increment: opts.increment ?? 2.5,
    notes: opts.notes || '', type: opts.type || 'strength'
  });

  const defaultPlan = {
    A: [
      { title:'PUSH · forza/ipertrofia', focus:'Petto · spalle · tricipiti', exercises:[
        ex('Chest press',3,'6-10',150,{increment:2.5}), ex('Distensioni manubri panca inclinata',3,'8-12',120,{increment:2}),
        ex('Croci ai cavi',3,'10-15',90,{increment:2.5}), ex('Shoulder press macchina',3,'6-10',120,{increment:2.5}),
        ex('Alzate laterali',3,'12-18',75,{increment:1}), ex('Pushdown corda',3,'8-12',90,{increment:2.5}),
        ex('Estensioni tricipiti sopra la testa al cavo',3,'10-15',75,{increment:2.5}), ex('Plank',3,'45-60 s',60,{type:'core',increment:0})
      ]},
      { title:'PULL + lombari', focus:'Dorso · bicipiti · lombari · core', exercises:[
        ex('Lat machine presa neutra',3,'6-10',150,{increment:2.5}), ex('Rematore supportato al petto',3,'6-10',150,{increment:2.5}),
        ex('Pulley basso',3,'8-12',120,{increment:2.5}), ex('Reverse fly / deltoidi posteriori',3,'12-18',75,{increment:1}),
        ex('Curl panca Scott',3,'8-12',90,{increment:1}), ex('Hammer curl',3,'8-12',90,{increment:1}),
        ex('Back extension controllata',3,'12-15',75,{type:'core',increment:2.5,notes:'Movimento controllato, senza iperestendere la zona lombare.'}),
        ex('Bird dog',3,'10-12 per lato',45,{type:'core',increment:0}), ex('Pallof press',3,'10-15 per lato',60,{type:'core',increment:1})
      ]},
      { title:'LEGS', focus:'Quadricipiti · femorali · glutei · polpacci', exercises:[
        ex('Leg press',3,'8-12',150,{increment:5}), ex('Bulgarian split squat',3,'8-12 per lato',120,{increment:2}),
        ex('Romanian deadlift con manubri',3,'8-12',120,{increment:2,notes:'Carico gestibile e colonna neutra.'}), ex('Hip thrust',3,'8-12',120,{increment:5}),
        ex('Leg curl',3,'10-15',90,{increment:2.5}), ex('Calf raise',4,'12-20',75,{increment:2.5}), ex('Side plank',3,'35-50 s per lato',45,{type:'core',increment:0})
      ]},
      { title:'UPPER', focus:'Richiamo petto · dorso · spalle', exercises:[
        ex('Chest press inclinata',3,'8-12',120,{increment:2.5}), ex('Lat machine',3,'8-12',120,{increment:2.5}),
        ex('Rematore macchina supportato',3,'8-12',120,{increment:2.5}), ex('Croci ai cavi',3,'12-15',75,{increment:2.5}),
        ex('Alzate laterali',3,'12-18',75,{increment:1}), ex('Face pull',3,'12-18',75,{increment:2.5}),
        ex('Curl al cavo',3,'10-15',75,{increment:1}), ex('Pushdown',3,'10-15',75,{increment:2.5}), ex('Dead bug',3,'10-12 per lato',45,{type:'core',increment:0})
      ]},
      { title:'LOWER + ARMS', focus:'Gambe · braccia · core', exercises:[
        ex('Leg press piedi medi',3,'10-15',120,{increment:5}), ex('Hip thrust',3,'10-15',120,{increment:5}), ex('Leg curl',3,'10-15',90,{increment:2.5}),
        ex('Leg extension',3,'12-18',90,{increment:2.5}), ex('Curl manubri alternato',3,'8-12',75,{increment:1}), ex('French press al cavo',3,'8-12',75,{increment:2.5}),
        ex('Cable crunch',3,'12-18',60,{type:'core',increment:2.5})
      ]},
      { title:'CARDIO + MOBILITÀ', focus:'Aerobico · recupero', exercises:[
        ex('Cardio Zona 2',1,'55-65 min',0,{type:'cardio',increment:0,notes:'Intensità facile-moderata; usa la frequenza cardiaca o il talk test.'}),
        ex('Mobilità anche / torace / caviglie',1,'10-15 min',0,{type:'mobility',increment:0})
      ]},
      { title:'RIPOSO', focus:'Recupero', exercises:[] }
    ],
    B: [
      { title:'PUSH · 8-15-25', focus:'Petto · spalle · tricipiti', exercises:[
        ex('Chest press',3,'8',120,{group:'Petto 8-15-25',increment:2.5}), ex('Distensioni manubri panca inclinata',3,'15',20,{group:'Petto 8-15-25',increment:2}), ex('Croci ai cavi',3,'25',120,{group:'Petto 8-15-25',increment:2.5}),
        ex('Shoulder press macchina',3,'8',120,{group:'Spalle 8-15-25',increment:2.5}), ex('Alzate laterali',3,'15',20,{group:'Spalle 8-15-25',increment:1}), ex('Face pull',3,'25',120,{group:'Spalle 8-15-25',increment:2.5}),
        ex('Pushdown corda',3,'8',90,{group:'Tricipiti 8-15-25',increment:2.5}), ex('Estensioni tricipiti sopra la testa',3,'15',20,{group:'Tricipiti 8-15-25',increment:2.5}), ex('Pushdown leggero',3,'25',90,{group:'Tricipiti 8-15-25',increment:2.5}),
        ex('Plank',3,'45-60 s',45,{type:'core',increment:0})
      ]},
      { title:'PULL · 8-15-25 + lombari', focus:'Dorso · bicipiti · lombari', exercises:[
        ex('Lat machine presa neutra',3,'8',120,{group:'Dorso 8-15-25',increment:2.5}), ex('Rematore supportato al petto',3,'15',20,{group:'Dorso 8-15-25',increment:2.5}), ex('Pullover al cavo',3,'25',120,{group:'Dorso 8-15-25',increment:2.5}),
        ex('Curl panca Scott',3,'8',90,{group:'Bicipiti 8-15-25',increment:1}), ex('Hammer curl',3,'15',20,{group:'Bicipiti 8-15-25',increment:1}), ex('Curl al cavo leggero',3,'25',90,{group:'Bicipiti 8-15-25',increment:1}),
        ex('Back extension controllata',3,'12-15',75,{type:'core',increment:2.5}), ex('Bird dog',3,'10-12 per lato',45,{type:'core',increment:0}), ex('Pallof press',3,'12 per lato',60,{type:'core',increment:1})
      ]},
      { title:'LEGS · 8-15-25', focus:'Quadricipiti · glutei · femorali', exercises:[
        ex('Leg press',3,'8',150,{group:'Quadricipiti 8-15-25',increment:5}), ex('Bulgarian split squat',3,'15 per lato',30,{group:'Quadricipiti 8-15-25',increment:2}), ex('Leg extension',3,'25',120,{group:'Quadricipiti 8-15-25',increment:2.5}),
        ex('Hip thrust',3,'8',150,{group:'Catena posteriore 8-15-25',increment:5}), ex('Romanian deadlift con manubri',3,'15',30,{group:'Catena posteriore 8-15-25',increment:2}), ex('Leg curl',3,'25',120,{group:'Catena posteriore 8-15-25',increment:2.5}),
        ex('Calf raise',4,'15-25',75,{increment:2.5}), ex('Side plank',3,'35-50 s per lato',45,{type:'core',increment:0})
      ]},
      { title:'UPPER · 8-15-25', focus:'Petto · dorso · spalle', exercises:[
        ex('Chest press inclinata',3,'8',120,{group:'Upper A',increment:2.5}), ex('Lat machine',3,'15',20,{group:'Upper A',increment:2.5}), ex('Croci ai cavi',3,'25',120,{group:'Upper A',increment:2.5}),
        ex('Rematore macchina supportato',3,'8',120,{group:'Upper B',increment:2.5}), ex('Alzate laterali',3,'15',20,{group:'Upper B',increment:1}), ex('Face pull',3,'25',120,{group:'Upper B',increment:2.5}),
        ex('Dead bug',3,'10-12 per lato',45,{type:'core',increment:0})
      ]},
      { title:'ARMS + LOWER · 8-15-25', focus:'Braccia · richiamo gambe · core', exercises:[
        ex('Curl bilanciere EZ',3,'8',90,{group:'Bicipiti',increment:1}), ex('Hammer curl',3,'15',20,{group:'Bicipiti',increment:1}), ex('Curl cavo',3,'25',90,{group:'Bicipiti',increment:1}),
        ex('Pushdown',3,'8',90,{group:'Tricipiti',increment:2.5}), ex('Estensioni sopra testa al cavo',3,'15',20,{group:'Tricipiti',increment:2.5}), ex('Pushdown leggero',3,'25',90,{group:'Tricipiti',increment:2.5}),
        ex('Leg press leggera',3,'15-20',90,{increment:5}), ex('Leg curl',3,'15-20',90,{increment:2.5}), ex('Cable crunch',3,'12-18',60,{type:'core',increment:2.5})
      ]},
      { title:'CARDIO QUALITÀ', focus:'Aerobico · qualità', exercises:[
        ex('Qualità corsa / cardio',1,'12 × 1 min / rec. 1:30',0,{type:'cardio',increment:0,notes:'Seduta modificabile: alternativa tempo run o intervalli.'}),
        ex('Defaticamento facile',1,'10-15 min',0,{type:'cardio',increment:0}), ex('Mobilità',1,'8-12 min',0,{type:'mobility',increment:0})
      ]},
      { title:'RIPOSO', focus:'Recupero', exercises:[] }
    ]
  };

  function defaultState(){
    return {
      version:1,
      cycleStart:START_DATE,
      plan:deepClone(defaultPlan),
      versions:[],
      overrides:{},
      sessions:{},
      settings:{timerMode:'visual-beep', soundVolume:0.7},
      ui:{view:'today', calendarMonth:monthKey(new Date()), programWeek:'A', programDay:0, selectedProgressExercise:''}
    };
  }

  let state = loadState();
  let timer = {end:0, interval:null};

  const main = document.getElementById('main');
  const pageTitle = document.getElementById('pageTitle');
  const weekBadge = document.getElementById('weekBadge');
  const modalRoot = document.getElementById('modalRoot');

  function cryptoId(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2)+Date.now()); }
  function deepClone(x){ return JSON.parse(JSON.stringify(x)); }
  function loadState(){
    try { const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return defaultState(); const s=JSON.parse(raw); return {...defaultState(),...s,settings:{...defaultState().settings,...s.settings},ui:{...defaultState().ui,...s.ui}}; }
    catch(e){ console.error(e); return defaultState(); }
  }
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function isoLocal(d=new Date()){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
  function parseDate(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d,12,0,0); }
  function addDays(iso,n){ const d=parseDate(iso); d.setDate(d.getDate()+n); return isoLocal(d); }
  function daysBetween(a,b){ return Math.floor((parseDate(b)-parseDate(a))/86400000); }
  function mondayIndex(date){ return (date.getDay()+6)%7; }
  function weekTypeForDate(iso){
    const diff=daysBetween(state.cycleStart, iso);
    const week=Math.floor(diff/7);
    return ((week%2)+2)%2===0 ? 'A':'B';
  }
  function planDayIndex(iso){ return mondayIndex(parseDate(iso)); }
  function monthKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
  function fmtDate(iso, opts={weekday:'long',day:'numeric',month:'long'}){ return parseDate(iso).toLocaleDateString('it-IT',opts); }
  function esc(v=''){ return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  function num(v){ const n=parseFloat(String(v).replace(',','.')); return Number.isFinite(n)?n:0; }
  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

  function getPlanForDate(iso){
    const ov=state.overrides[iso];
    if(ov?.movedTo && !ov.workout) return {title:'SPOSTATO',focus:`Spostato al ${fmtDate(ov.movedTo,{day:'numeric',month:'short'})}`,exercises:[],moved:true};
    if(ov?.workout) return deepClone(ov.workout);
    const w=weekTypeForDate(iso), di=planDayIndex(iso);
    const candidates=state.versions.filter(v=>v.weekType===w && v.dayIndex===di && v.effectiveFrom<=iso).sort((a,b)=>a.effectiveFrom.localeCompare(b.effectiveFrom));
    if(candidates.length) return deepClone(candidates[candidates.length-1].dayPlan);
    return deepClone(state.plan[w][di]);
  }

  function sessionStatus(iso){
    const s=state.sessions[iso];
    if(s?.status) return s.status;
    if(state.overrides[iso]?.movedTo && !state.overrides[iso]?.workout) return 'rest';
    const p=getPlanForDate(iso); return p.exercises.length ? 'planned' : 'rest';
  }

  function createSession(iso){
    if(state.sessions[iso]) return state.sessions[iso];
    const p=getPlanForDate(iso); const week=weekTypeForDate(iso);
    const s={id:cryptoId(),date:iso,weekType:week,title:p.title,focus:p.focus,status:'partial',startedAt:new Date().toISOString(),endedAt:null,notes:'',exercises:p.exercises.map(e=>({
      ...deepClone(e), setsLog:Array.from({length:e.sets},()=>({kg:'',reps:'',rir:'',rpe:'',done:false}))
    }))};
    state.sessions[iso]=s; save(); return s;
  }

  function previousExerciseLogs(name, beforeIso){
    return Object.values(state.sessions).filter(s=>s.date<beforeIso && ['done','partial'].includes(s.status)).sort((a,b)=>b.date.localeCompare(a.date)).map(s=>({s,ex:s.exercises.find(e=>e.name===name)})).find(x=>x.ex)?.ex || null;
  }
  function previousExerciseSession(name, beforeIso){
    return Object.values(state.sessions).filter(s=>s.date<beforeIso && ['done','partial'].includes(s.status)).sort((a,b)=>b.date.localeCompare(a.date)).find(s=>s.exercises.some(e=>e.name===name)) || null;
  }
  function repTop(repText){ const nums=(String(repText).match(/\d+(?:[.,]\d+)?/g)||[]).map(num); return nums.length?Math.max(...nums):0; }
  function suggestLoad(exercise,date){
    if(exercise.type!=='strength') return '';
    const prev=previousExerciseLogs(exercise.name,date); if(!prev) return 'Prima registrazione: scegli un carico tecnico e lascia 1-3 RIR.';
    const done=prev.setsLog.filter(s=>s.done && num(s.kg)>0); if(!done.length) return '';
    const avgKg=done.reduce((a,s)=>a+num(s.kg),0)/done.length;
    const target=repTop(exercise.reps); const avgReps=done.reduce((a,s)=>a+num(s.reps),0)/done.length;
    const rirVals=done.map(s=>num(s.rir)).filter(v=>v>=0); const avgRir=rirVals.length?rirVals.reduce((a,b)=>a+b,0)/rirVals.length:1;
    const inc=num(exercise.increment)||2.5;
    if(target && avgReps>=target && avgRir>=1) return `Suggerimento: prova ${roundTo(avgKg+inc,inc)} kg (+${inc} kg).`;
    if(target && avgReps<target*0.7) return `Suggerimento: valuta ${roundTo(avgKg*0.95,inc)} kg (-5% circa).`;
    return `Suggerimento: mantieni circa ${roundTo(avgKg,inc)} kg e prova ad aumentare reps/RIR.`;
  }
  function roundTo(v,step){ if(!step) return Math.round(v*10)/10; return Math.round(v/step)*step; }
  function previousText(name,date){
    const ps=previousExerciseSession(name,date); if(!ps) return 'Nessuno storico precedente.';
    const e=ps.exercises.find(x=>x.name===name); const rows=e.setsLog.filter(s=>s.done).map(s=>`${s.kg||'-'} kg × ${s.reps||'-'}`).join(' · ');
    return rows ? `${fmtDate(ps.date,{day:'numeric',month:'short'})}: ${rows}` : 'Nessuno storico precedente.';
  }

  function createFutureVersionModal(){ const w=state.ui.programWeek,di=state.ui.programDay; showModal(`<h2>Versione futura</h2><p class="muted">Copia il modello attuale di ${DAY_NAMES[di]} - Settimana ${w} e rendilo valido da una data in avanti. Potrai poi modificarlo dalla giornata specifica.</p><label>Valido da<input id="futureFrom" type="date" value="${state.cycleStart}"></label><div class="modal-actions"><button class="secondary" onclick="appCloseModal()">Annulla</button><button class="primary" id="saveFuture">Crea</button></div>`); document.getElementById('saveFuture').onclick=()=>{const date=document.getElementById('futureFrom').value;if(!date)return;state.versions.push({id:cryptoId(),effectiveFrom:date,weekType:w,dayIndex:di,dayPlan:deepClone(state.plan[w][di])});save();closeModal();toast('Versione futura creata');}; }

  function openDayPlanEditor(date,plan,scope='date'){
    const draft=deepClone(plan); const renderDraft=()=>{showModal(`<div class="eyebrow">${esc(fmtDate(date).toUpperCase())}</div><h2>Modifica giornata</h2><label>Titolo<input id="dpTitle" value="${esc(draft.title)}"></label><label style="margin-top:8px">Focus<input id="dpFocus" value="${esc(draft.focus)}"></label><div style="margin-top:12px">${draft.exercises.map((e,i)=>`<div class="list-item"><div><h4>${esc(e.name)}</h4><p>${e.sets} × ${esc(e.reps)} · ${fmtSec(e.rest)}</p></div><button class="secondary small-btn" data-draftedit="${i}">✎</button></div>`).join('')}</div><button class="secondary wide" id="draftAdd">+ Aggiungi esercizio</button><div class="form-grid" style="margin-top:12px"><label>Ambito<select id="dpScope"><option value="date">Solo ${fmtDate(date,{day:'numeric',month:'short'})}</option><option value="future">Da questa data in avanti</option><option value="general">Modello generale</option></select></label><label>Data effettiva<input id="dpEffective" type="date" value="${date}"></label></div><div class="modal-actions"><button class="ghost" onclick="appCloseModal()">Annulla</button><button class="primary" id="saveDayPlan">Salva modifiche</button></div>`); document.getElementById('dpScope').value=scope; document.querySelectorAll('[data-draftedit]').forEach(b=>b.onclick=()=>exerciseEditorModal(draft.exercises[+b.dataset.draftedit],saved=>{draft.exercises[+b.dataset.draftedit]=saved;renderDraft();})); document.getElementById('draftAdd').onclick=()=>exerciseEditorModal(ex('Nuovo esercizio',3,'8-12',90),saved=>{draft.exercises.push(saved);renderDraft();}); document.getElementById('saveDayPlan').onclick=()=>{draft.title=document.getElementById('dpTitle').value.trim()||'Allenamento';draft.focus=document.getElementById('dpFocus').value.trim();const sc=document.getElementById('dpScope').value, eff=document.getElementById('dpEffective').value||date;const w=weekTypeForDate(date),di=planDayIndex(date);if(sc==='date')state.overrides[date]={...(state.overrides[date]||{}),workout:deepClone(draft)};else if(sc==='future')state.versions.push({id:cryptoId(),effectiveFrom:eff,weekType:w,dayIndex:di,dayPlan:deepClone(draft)});else state.plan[w][di]=deepClone(draft);save();closeModal();toast('Modifica salvata');render();}; };
    renderDraft();
  }

  function editSessionExercise(date,index){ const s=state.sessions[date]; const existing=index>=0?s.exercises[index]:{...ex('Nuovo esercizio',3,'8-12',90),setsLog:[]}; exerciseEditorModal(existing,saved=>{if(index>=0){const old=s.exercises[index];s.exercises[index]={...old,...saved,setsLog:resizeLogs(old.setsLog,saved.sets)};}else{s.exercises.push({...saved,setsLog:Array.from({length:saved.sets},()=>({kg:'',reps:'',rir:'',rpe:'',done:false}))});}save();closeModal();openWorkout(date);}); }
  function resizeLogs(logs,n){ const out=deepClone(logs||[]);while(out.length<n)out.push({kg:'',reps:'',rir:'',rpe:'',done:false});return out.slice(0,n); }
  function setCount(date,ei,delta){ const s=state.sessions[date],e=s.exercises[ei];if(delta>0)e.setsLog.push({kg:'',reps:'',rir:'',rpe:'',done:false});else if(e.setsLog.length>1)e.setsLog.pop();e.sets=e.setsLog.length;save();openWorkout(date); }

  function renderHistory(){
    const list=Object.values(state.sessions).sort((a,b)=>b.date.localeCompare(a.date));
    main.innerHTML=`<section class="card"><h3 style="margin-top:0">Allenamenti registrati</h3>${list.length?list.map(s=>{const sets=s.exercises.reduce((a,e)=>a+e.setsLog.filter(x=>x.done).length,0);const vol=sessionVolume(s);return `<button class="list-item" style="width:100%;text-align:left;background:transparent;color:white;border-left:0;border-right:0;border-top:0" data-hdate="${s.date}"><div><h4>${esc(fmtDate(s.date,{weekday:'short',day:'numeric',month:'short'}))} · ${esc(s.title)}</h4><p>Settimana ${s.weekType} · ${sets} serie · volume ${Math.round(vol).toLocaleString('it-IT')} kg</p></div><span class="status ${s.status}">${statusLabel(s.status)}</span></button>`}).join(''):'<p class="muted">Nessun allenamento registrato.</p>'}</section>`;
    document.querySelectorAll('[data-hdate]').forEach(b=>b.onclick=()=>openWorkout(b.dataset.hdate));
  }
  function sessionVolume(s){ return s.exercises.reduce((tot,e)=>tot+e.setsLog.filter(x=>x.done).reduce((a,x)=>a+num(x.kg)*num(x.reps),0),0); }

  function allExerciseNames(){ return [...new Set(Object.values(state.sessions).flatMap(s=>s.exercises.map(e=>e.name)))].sort((a,b)=>a.localeCompare(b,'it')); }
  function exerciseSeries(name){ return Object.values(state.sessions).filter(s=>['done','partial'].includes(s.status)).sort((a,b)=>a.date.localeCompare(b.date)).map(s=>{const e=s.exercises.find(x=>x.name===name);if(!e)return null;const sets=e.setsLog.filter(x=>x.done&&num(x.kg)>0&&num(x.reps)>0);if(!sets.length)return null;const bestKg=Math.max(...sets.map(x=>num(x.kg)));const e1rm=Math.max(...sets.map(x=>num(x.kg)*(1+num(x.reps)/30)));const volume=sets.reduce((a,x)=>a+num(x.kg)*num(x.reps),0);return {date:s.date,bestKg,e1rm,volume};}).filter(Boolean); }
  function renderProgress(){
    const names=allExerciseNames(); if(!state.ui.selectedProgressExercise&&names.length)state.ui.selectedProgressExercise=names[0]; const name=state.ui.selectedProgressExercise; const data=name?exerciseSeries(name):[]; const bestKg=data.length?Math.max(...data.map(x=>x.bestKg)):0,best1=data.length?Math.max(...data.map(x=>x.e1rm)):0,vol=data.reduce((a,x)=>a+x.volume,0);
    main.innerHTML=`<section class="card"><label>Esercizio<select id="progressExercise">${names.map(n=>`<option ${n===name?'selected':''}>${esc(n)}</option>`).join('')}</select></label></section>${name?`<section class="card"><div class="grid3"><div class="metric"><small>Max carico</small><b>${bestKg.toFixed(1)} kg</b></div><div class="metric"><small>1RM stimato</small><b>${best1.toFixed(1)} kg</b></div><div class="metric"><small>Volume storico</small><b>${Math.round(vol).toLocaleString('it-IT')}</b></div></div></section><section class="card"><div class="row space"><h3 style="margin:0">Andamento</h3><select id="metricSelect" style="width:auto"><option value="bestKg">Carico</option><option value="e1rm">1RM stimato</option><option value="volume">Volume</option></select></div><div id="chartWrap" style="margin-top:12px"></div></section><section class="card"><h3 style="margin-top:0">Record</h3><div class="list-item"><div><h4>Miglior carico</h4><p>${bestKg.toFixed(1)} kg</p></div></div><div class="list-item"><div><h4>Miglior 1RM stimato</h4><p>${best1.toFixed(1)} kg</p></div></div><div class="list-item"><div><h4>Sessioni registrate</h4><p>${data.length}</p></div></div></section>`:`<section class="card"><p class="muted">Registra almeno una serie con peso e ripetizioni per vedere i progressi.</p></section>`}`;
    document.getElementById('progressExercise')?.addEventListener('change',e=>{state.ui.selectedProgressExercise=e.target.value;save();render();});
    const metric=document.getElementById('metricSelect'); if(metric){const draw=()=>document.getElementById('chartWrap').innerHTML=svgChart(data,metric.value);metric.onchange=draw;draw();}
  }
  function svgChart(data,key){ if(!data.length)return '<p class="muted">Nessun dato.</p>'; const w=640,h=220,p=32,vals=data.map(d=>d[key]),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1; const pts=data.map((d,i)=>{const x=p+(data.length===1?0:(i*(w-2*p)/(data.length-1))),y=h-p-((d[key]-min)/span)*(h-2*p);return{x,y,v:d[key],date:d.date};}); return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line class="grid" x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}"/><line class="grid" x1="${p}" y1="${p}" x2="${p}" y2="${h-p}"/><polyline class="line" points="${pts.map(q=>`${q.x},${q.y}`).join(' ')}"/>${pts.map(q=>`<circle class="point" cx="${q.x}" cy="${q.y}" r="4"><title>${q.date}: ${q.v.toFixed(1)}</title></circle>`).join('')}<text x="${p}" y="18">${max.toFixed(1)}</text><text x="${p}" y="${h-8}">${min.toFixed(1)}</text></svg>`; }

  function renderSettings(){
    main.innerHTML=`<section class="card"><h3 style="margin-top:0">Timer</h3><div class="form-grid"><label>Avviso<select id="timerMode"><option value="visual">Solo visivo</option><option value="visual-beep">Visivo + bip</option></select></label><label>Volume bip<input id="timerVol" type="range" min="0" max="1" step="0.1" value="${state.settings.soundVolume}"></label></div><button class="secondary" style="margin-top:10px" id="testBeep">Prova bip</button></section>
      <section class="card"><h3 style="margin-top:0">Alternanza A/B</h3><label>Primo giorno della Settimana A<input id="cycleStart" type="date" value="${state.cycleStart}"></label><p class="muted">Il calendario alterna automaticamente A e B ogni 7 giorni a partire da questa data.</p></section>
      <section class="card"><h3 style="margin-top:0">Dati</h3><p class="muted">I dati restano su questo dispositivo/browser. Nessun cloud è attivo in questa versione.</p><button class="danger" id="resetData">Azzera tutti i dati</button></section>
      <section class="card"><h3 style="margin-top:0">Versione online</h3><p class="muted">Questa è una pagina HTML autonoma. I dati vengono salvati nel browser tramite localStorage: usando sempre lo stesso dispositivo, browser e indirizzo web ritroverai programma e storico.</p></section>`;
    const tm=document.getElementById('timerMode');tm.value=state.settings.timerMode;tm.onchange=e=>{state.settings.timerMode=e.target.value;save();};document.getElementById('timerVol').oninput=e=>{state.settings.soundVolume=+e.target.value;save();};document.getElementById('testBeep').onclick=beep;document.getElementById('cycleStart').onchange=e=>{state.cycleStart=e.target.value||START_DATE;save();render();};document.getElementById('resetData').onclick=()=>{if(confirm('Cancellare programma personalizzato, storico e impostazioni?')){localStorage.removeItem(STORAGE_KEY);state=defaultState();save();render();}};
  }

  function startTimer(seconds){ if(!seconds)return; timer.end=Date.now()+seconds*1000; const ov=document.getElementById('timerOverlay');ov.classList.remove('hidden'); clearInterval(timer.interval); updateTimer(); timer.interval=setInterval(updateTimer,250); }
  function updateTimer(){ const left=Math.max(0,Math.ceil((timer.end-Date.now())/1000)); document.getElementById('timerText').textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`; if(left<=0){clearInterval(timer.interval); if(state.settings.timerMode==='visual-beep')beep(); document.querySelector('.timer-card').animate([{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:650,iterations:2});} }
  function stopTimer(){ clearInterval(timer.interval);document.getElementById('timerOverlay').classList.add('hidden'); }
  function beep(){ try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),g=ctx.createGain(),o=ctx.createOscillator();g.gain.value=state.settings.soundVolume||0.7;o.frequency.value=880;o.connect(g);g.connect(ctx.destination);o.start();setTimeout(()=>{o.stop();ctx.close();},300);}catch(e){} }

  function showModal(html){ modalRoot.innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal">${html}</div></div>`; document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal();}); }
  function closeModal(){ modalRoot.innerHTML=''; }
  function fmtSec(sec){ if(!sec)return '—'; if(sec<60)return `${sec}s`; const m=Math.floor(sec/60),s=sec%60;return s?`${m}:${String(s).padStart(2,'0')}`:`${m} min`; }
  function statusLabel(s){ return ({done:'Completato',partial:'Parziale',skipped:'Saltato',planned:'Programmato',rest:'Riposo'})[s]||s; }

  window.appEditDate=(date)=>openDayPlanEditor(date,getPlanForDate(date),'date');
  window.appEditProgramEx=editProgramExercise; window.appMoveProgramEx=moveProgramEx; window.appDeleteProgramEx=deleteProgramEx;
  window.appEditSessionExercise=editSessionExercise; window.appSetCount=setCount; window.appStartTimer=startTimer; window.appCloseModal=closeModal;

  document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{state.ui.view=b.dataset.view;save();render();}));
  document.getElementById('timerStop').onclick=stopTimer; document.getElementById('timerMinus').onclick=()=>{timer.end=Math.max(Date.now(),timer.end-15000);updateTimer();}; document.getElementById('timerPlus').onclick=()=>{timer.end+=15000;updateTimer();};

  render();
})();

  </script>
</body>
</html>
